[tools]
zola = "latest"

[tasks.build]
description = "Build the Zola site into public/"
run = "zola build"

[tasks.serve]
description = "Serve the site locally with live reload"
run = "zola serve"

[tasks.check]
description = "Build and check internal and external links"
run = "zola check"

[tasks.clean]
description = "Remove build output and generated image derivatives"
run = "rm -rf public static/processed_images"
