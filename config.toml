# Zola configuration for Cyberparadism
# https://www.getzola.org/documentation/getting-started/configuration/

base_url = "https://zarazinsfuss.github.io/cyberparadism"
title = "Cyberparadism"
description = "A techno-optimist aesthetic: small, advanced human enclaves set inside lush and untamed nature, where mature technology quietly provides abundance."
default_language = "en"
author = "zarazinsfuss"

compile_sass = true
minify_html = true
build_search_index = false
generate_feeds = true
feed_filenames = ["rss.xml"]

taxonomies = [
  { name = "settings", feed = false },
  { name = "motifs", feed = false },
]

[markdown]
lazy_async_image = true
smart_punctuation = true

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

[link_checker]
# Fandom and the social platforms answer automated requests with 403.
skip_prefixes = [
  "https://aesthetics.fandom.com",
  "https://personal-aesthetics.fandom.com",
  "https://www.tiktok.com",
  "https://www.tumblr.com",
  "https://a16z.com",
]

[extra]
tagline = "A techno-optimist aesthetic"
motto = "Sophistication of technology is the gateway to abundance and prosperity."
repo_url = "https://github.com/zarazinsfuss/cyberparadism"
edit_base = "https://github.com/zarazinsfuss/cyberparadism/edit/main/content/"
issues_url = "https://github.com/zarazinsfuss/cyberparadism/issues/new/choose"
og_image = "img/og-default.jpg"
wiki_url = "https://personal-aesthetics.fandom.com/wiki/Cyberparadism"
manifesto_repo = "https://github.com/zarazinsfuss/cyberparadism-manifesto"

